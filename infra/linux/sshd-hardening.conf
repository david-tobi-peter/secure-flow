# SecureFlow — SSH ingress
# Template: ${SSH_USER} is substituted from the environment at install time.

# disable password-based authentication
PasswordAuthentication no

# disable keyboard-interactive (challenge-response) authentication
KbdInteractiveAuthentication no

# enable public key authentication
PubkeyAuthentication yes

# prevent root from logging in directly
PermitRootLogin no

# allow only ${SSH_USER} to authenticate
AllowUsers ${SSH_USER}

# send a keepalive probe after 10 minutes of inactivity
ClientAliveInterval 600

# disconnect the session after 2 unanswered probes
ClientAliveCountMax 2

# disable X11 forwarding
X11Forwarding no

# disable SSH agent forwarding
AllowAgentForwarding no

# disable TCP-level keepalives
TCPKeepAlive no

# log the fingerprint of the key each session authenticated with
LogLevel VERBOSE

# hide the distribution name and version from the SSH banner
DebianBanner no

# AllowTcpForwarding is left at its default (yes)
