paths:
  /auth/pow:
    post:
      summary: Request a proof-of-work challenge
      operationId: issuePowChallenge
      tags:
        - auth
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/PowChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered; the token authorises two-factor setup
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/RegisterResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /auth/setup-2fa:
    post:
      summary: Set up two-factor authentication
      description: Proves the account with the token from registration, or with the email and password once that token has expired.
      operationId: setupTwoFactor
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/PowChallengeHeader"
        - $ref: "#/components/parameters/PowSolutionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupTwoFactorRequest"
      responses:
        "200":
          description: Authenticator secret issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/SetupTwoFactorResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/POWRequired"

  /auth/login:
    post:
      summary: Check a password and open the two-factor step
      operationId: loginUser
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/PowChallengeHeader"
        - $ref: "#/components/parameters/PowSolutionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted; two-factor code still required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/PendingLogin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/POWRequired"

  /auth/verify-totp:
    post:
      summary: Exchange a two-factor code for a session
      operationId: verifyTotp
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTotpRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      summary: Log out
      operationId: logoutUser
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
schemas:
  RegisterRequest:
    type: object
    required:
      - email
      - password
      - name
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        minLength: 8
      name:
        type: string
        minLength: 1

  RegisterResult:
    type: object
    required:
      - verificationToken
    properties:
      verificationToken:
        type: string

  SetupTwoFactorRequest:
    oneOf:
      - $ref: "#/components/schemas/SetupTwoFactorTokenRequest"
      - $ref: "#/components/schemas/SetupTwoFactorCredentialsRequest"

  SetupTwoFactorTokenRequest:
    type: object
    required:
      - verificationToken
    additionalProperties: false
    properties:
      verificationToken:
        type: string

  SetupTwoFactorCredentialsRequest:
    type: object
    required:
      - email
      - password
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string

  SetupTwoFactorResult:
    type: object
    required:
      - secret
      - otpauthUrl
    properties:
      secret:
        type: string
      otpauthUrl:
        type: string

  LoginRequest:
    type: object
    required:
      - email
      - password
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string

  PendingLogin:
    type: object
    required:
      - pendingToken
    properties:
      pendingToken:
        type: string

  VerifyTotpRequest:
    type: object
    required:
      - pendingToken
      - code
    additionalProperties: false
    properties:
      pendingToken:
        type: string
      code:
        type: string

  PowChallenge:
    type: object
    required:
      - challenge
      - difficulty
      - algorithm
      - expiresAt
    properties:
      challenge:
        type: string
      difficulty:
        type: integer
        minimum: 1
      algorithm:
        type: string
      expiresAt:
        type: integer

  User:
    type: object
    required:
      - id
      - email
      - name
    properties:
      id:
        type: string
        format: uuid
      email:
        type: string
        format: email
      name:
        type: string

  AuthResult:
    type: object
    required:
      - token
      - user
    properties:
      token:
        type: string
      user:
        $ref: "#/components/schemas/User"
