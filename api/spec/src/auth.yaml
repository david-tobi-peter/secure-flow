paths:
  /auth/pow:
    post:
      summary: Request a proof-of-work challenge
      operationId: issuePowChallenge
      tags:
        - auth
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/PowChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      summary: Log in
      operationId: loginUser
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "428":
          $ref: "#/components/responses/POWRequired"

  /auth/logout:
    post:
      summary: Log out
      operationId: logoutUser
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
schemas:
  RegisterRequest:
    type: object
    required:
      - email
      - password
      - name
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        minLength: 8
      name:
        type: string
        minLength: 1

  LoginRequest:
    type: object
    required:
      - email
      - password
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string

  PowChallenge:
    type: object
    required:
      - challenge
      - difficulty
      - algorithm
      - expiresAt
    properties:
      challenge:
        type: string
      difficulty:
        type: integer
        minimum: 1
      algorithm:
        type: string
      expiresAt:
        type: integer

  User:
    type: object
    required:
      - id
      - email
      - name
    properties:
      id:
        type: string
        format: uuid
      email:
        type: string
        format: email
      name:
        type: string

  AuthResult:
    type: object
    required:
      - token
      - user
    properties:
      token:
        type: string
      user:
        $ref: "#/components/schemas/User"
