paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: One or more dependencies are down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
schemas:
  HealthEnvelope:
    allOf:
      - $ref: "#/components/schemas/APIResponse"
      - type: object
        required:
          - data
        properties:
          data:
            $ref: "#/components/schemas/HealthResponse"
  HealthResponse:
    type: object
    required:
      - status
      - checks
      - uptime
      - timestamp
    properties:
      status:
        type: string
        enum:
          - ok
          - degraded
      checks:
        type: object
        required:
          - postgres
          - redis
        properties:
          postgres:
            type: string
            enum:
              - ok
              - down
          redis:
            type: string
            enum:
              - ok
              - down
      uptime:
        type: string
        description: Uptime as days, hours, minutes and seconds, e.g. "3d 4h 38m 12s".
      timestamp:
        type: string
        format: date-time
