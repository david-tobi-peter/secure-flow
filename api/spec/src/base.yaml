openapi: 3.1.0
info:
  title: SecureFlow API
  version: 0.1.0
  description: Deliberately boring multi-tenant project-management API.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string

    APIResponse:
      type: object
      required:
        - status
        - summary
      properties:
        status:
          type: integer
          description: HTTP status code of the response.
        summary:
          type: string
          description: Short human-readable summary of the operation's result.
        requestId:
          type: string
          description: Correlation id; matches the x-request-id response header.
        data:
          description: Operation payload; shape is endpoint-specific.

    Pagination:
      type: object
      required:
        - page
        - perPage
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        next:
          type: integer
          nullable: true
        prev:
          type: integer
          nullable: true
