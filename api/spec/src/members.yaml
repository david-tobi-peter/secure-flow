paths:
  /organizations/{orgId}/members:
    get:
      summary: List members of an organization
      operationId: listMembers
      tags:
        - members
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Invite a member
      operationId: inviteMember
      tags:
        - members
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Member invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /organizations/{orgId}/members/{userId}:
    patch:
      summary: Change a member's role
      operationId: changeMemberRole
      tags:
        - members
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMemberRoleRequest"
      responses:
        "200":
          description: Role changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove a member
      operationId: revokeMember
      tags:
        - members
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
schemas:
  Member:
    type: object
    required:
      - id
      - email
      - name
      - role
    properties:
      id:
        type: string
        format: uuid
      email:
        type: string
        format: email
      name:
        type: string
      role:
        type: string
        enum:
          - owner
          - admin
          - member
      joinedAt:
        type: string
        format: date-time
  InviteMemberRequest:
    type: object
    required:
      - email
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
  ChangeMemberRoleRequest:
    type: object
    required:
      - role
    additionalProperties: false
    properties:
      role:
        type: string
        enum:
          - admin
          - member
  MemberEnvelope:
    allOf:
      - $ref: "#/components/schemas/APIResponse"
      - type: object
        required:
          - data
        properties:
          data:
            $ref: "#/components/schemas/Member"
  MemberListEnvelope:
    allOf:
      - $ref: "#/components/schemas/APIResponse"
      - $ref: "#/components/schemas/Pagination"
      - type: object
        required:
          - data
        properties:
          data:
            type: array
            items:
              $ref: "#/components/schemas/Member"
