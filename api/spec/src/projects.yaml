paths:
  /organizations/{orgId}/projects:
    post:
      summary: Create a project
      operationId: createProject
      tags:
        - projects
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      summary: List projects in an organization
      operationId: listProjects
      tags:
        - projects
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Projects list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /organizations/{orgId}/projects/{projectId}:
    get:
      summary: Get a project
      operationId: getProject
      tags:
        - projects
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a project
      operationId: deleteProject
      tags:
        - projects
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
schemas:
  Project:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      createdAt:
        type: string
        format: date-time
  CreateProjectRequest:
    type: object
    required:
      - name
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
  ProjectEnvelope:
    allOf:
      - $ref: "#/components/schemas/APIResponse"
      - type: object
        required:
          - data
        properties:
          data:
            $ref: "#/components/schemas/Project"
  ProjectListEnvelope:
    allOf:
      - $ref: "#/components/schemas/APIResponse"
      - $ref: "#/components/schemas/Pagination"
      - type: object
        required:
          - data
        properties:
          data:
            type: array
            items:
              $ref: "#/components/schemas/Project"
